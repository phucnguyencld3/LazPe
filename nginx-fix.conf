# === Cấu hình Rate Limit (Chống Spam F5/DDoS) ===
# Vùng nhớ 10MB (lưu khoảng 160.000 IP)
# Tăng rate và burst lên ngưỡng an toàn cao cho Next.js Client Batch Fetch
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=100r/s; # Web: trung bình 100 request/giây
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;  # API: trung bình 100 request/giây

# Ẩn version của Nginx trên các trang báo lỗi (tăng tính bảo mật và thẩm mỹ)
server_tokens off;

# Tăng giới hạn dung lượng upload file (mặc định của Nginx là 1MB, gây lỗi CORS 413 khi up file > 1MB)
client_max_body_size 20M;

server {
    listen 80;
    server_name lazpe.store www.lazpe.store;
    
    # Bỏ qua Rate Limit cho các file tĩnh của Next.js (JS, CSS, Images)
    location /_next/static/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    location / {
        # Áp dụng Rate Limit cho Web (cho phép dồn tối đa 300 request cùng lúc)
        limit_req zone=web_limit burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.lazpe.store;
    location / {
        # Áp dụng Rate Limit cho API (cho phép dồn tối đa 300 request cùng lúc)
        limit_req zone=api_limit burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bắt buộc cho SignalR WebSockets và Server-Sent Events
    location ~* ^/(chatHub|notificationHub|directMessageHub|bannerHub) {
        proxy_pass http://localhost:5101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 100s;
    }
}

server {
    listen 443 ssl;
    server_name lazpe.store www.lazpe.store;

    ssl_certificate /etc/letsencrypt/live/lazpe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lazpe.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Bỏ qua Rate Limit cho các file tĩnh của Next.js
    location /_next/static/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    location / {
        # Áp dụng Rate Limit cho Web (HTTPS)
        limit_req zone=web_limit burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.lazpe.store;

    ssl_certificate /etc/letsencrypt/live/lazpe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lazpe.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Áp dụng Rate Limit cho API (HTTPS)
        limit_req zone=api_limit burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bắt buộc cho SignalR WebSockets và Server-Sent Events (HTTPS)
    location ~* ^/(chatHub|notificationHub|directMessageHub|bannerHub) {
        proxy_pass http://localhost:5101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 100s;
    }
}
