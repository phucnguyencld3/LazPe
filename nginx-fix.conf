# === Cấu hình Rate Limit (Chống Spam F5/DDoS) ===
# Vùng nhớ 10MB (lưu khoảng 160.000 IP)
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=10r/s; # Web: tối đa 10 request/giây
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;  # API: tối đa 5 request/giây

# Ẩn version của Nginx trên các trang báo lỗi (tăng tính bảo mật và thẩm mỹ)
server_tokens off;

server {
    listen 80;
    server_name lazpe.store www.lazpe.store;
    location / {
        # Áp dụng Rate Limit cho Web
        limit_req zone=web_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.lazpe.store;
    location / {
        # Áp dụng Rate Limit cho API
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name lazpe.store www.lazpe.store;

    ssl_certificate /etc/letsencrypt/live/lazpe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lazpe.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Áp dụng Rate Limit cho Web (HTTPS)
        limit_req zone=web_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.lazpe.store;

    ssl_certificate /etc/letsencrypt/live/lazpe.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lazpe.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Áp dụng Rate Limit cho API (HTTPS)
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
