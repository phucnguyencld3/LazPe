services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lazpe-db-prod
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LazPeSecurePwd@2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data_prod:/var/opt/mssql
    networks:
      - lazpe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lazpe-backend-prod
    restart: always
    ports:
      - "5101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=LazPeDB;User Id=sa;Password=LazPeSecurePwd@2026!;TrustServerCertificate=True;
      - VnPay__ReturnUrl=https://api.lazpe.vn/api/payment/vnpay-return
      - VnPay__FrontendBaseUrl=https://lazpe.vn
    depends_on:
      - db
    networks:
      - lazpe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.lazpe.vn/api
    container_name: lazpe-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    networks:
      - lazpe-network

volumes:
  mssql_data_prod:

networks:
  lazpe-network:
    driver: bridge
