services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lazpe-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourSecurePassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - lazpe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lazpe-backend
    ports:
      - "5101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=LazPeDB;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;
    depends_on:
      - db
    networks:
      - lazpe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5101/api
    container_name: lazpe-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    networks:
      - lazpe-network

volumes:
  mssql_data:

networks:
  lazpe-network:
    driver: bridge
